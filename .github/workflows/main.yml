name: CI-CD
on:
  push:
    branches: [ "minha_aula2" ]
  workflow_dispatch:
jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              
            - uses: actions/setup-python@v6
              with:
                python-version: '3.11' 
                
            - name: Install Dependencies para rodar testes
              working-directory: 02-encontros-tech
              run: |
                python -m pip install --upgrade pip 
                pip install -r requirements.txt
            
            - name: Testes
              working-directory: 02-encontros-tech
              run: python -m pytest tests/ -v  
                
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker Hub
              uses: docker/build-push-action@v6
              with:
                push: true
                tags: eduardobarbosa81/bootcamp-encontros:v${{ github.run_number }}
                file: ./02-encontros-tech/Dockerfile
                context: ./02-encontros-tech

    CD-homolog:
        runs-on: ubuntu-latest
        environment: homolog
        needs: [CI]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            
            - name: Configuracao do Kubernetes
              uses: azure/k8s-set-context@v4
              with:
                method: kubeconfig
                kubeconfig: ${{ secrets.KUBECONFIG }}

            - name: Create namespace if not exists (retorno é passado para comando após '|')
              run: kubectl create namespace tech-homolog --dry-run-client -o yaml | kubectl apply -f -
              
            - name: Create secrets in homolog (criar secret 'DATABASE_URL' no environment secrets)
              run: |
                kubectl create secret generic encontros-tech-secrets \
                --from-literal-DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                --namespace-tech-homolog \
                --dry-run-client -o yaml | kubectl apply -f
            
            - name: Deploy em Kubernetes
              uses: azure/k8s-deploy@v5
              with:
                namespace: tech-homolog
                manifests: 02-encontros-tech/k8s/manifests.yaml
                images: eduardobarbosa81/bootcamp-encontros:v${{ github.run_number }}
    
    CD-producao:
        runs-on: ubuntu-latest
        environment: producao
        needs: [CD-homolog]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            
            - name: Configuracao do Kubernetes
              uses: azure/k8s-set-context@v4
              with:
                method: kubeconfig
                kubeconfig: ${{ secrets.KUBECONFIG }}

            - name: Create namespace if not exists (retorno é passado para comando após '|')
              run: kubectl create namespace tech-producao --dry-run=client -o yaml | kubectl apply -f -
              
            - name: Create secrets in producao (criar secret 'DATABASE_URL' no environment secrets)
              run: |
                kubectl create secret generic encontros-tech-secrets \
                --from-literal-DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                --namespace-tech-producao \
                --dry-run-client -o yaml | kubectl apply -f
            
            - name: Deploy em Kubernetes
              uses: azure/k8s-deploy@v5
              with:
                namespace: tech-producao
                manifests: 02-encontros-tech/k8s/manifests.yaml
                images: eduardobarbosa81/bootcamp-encontros:v${{ github.run_number }}
      
